[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-figure-patterns"
version = "0.2.1"
description = "Design patterns for publication-quality academic figures. Content-focused guidance backed by analysis of 50+ top-venue papers and field-tested through author review."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Jintao Li"},
]
keywords = [
    "matplotlib", "academic", "figures", "publication", "design-patterns",
    "scientific-visualization", "paper-writing", "NeurIPS", "ICML", "ICLR",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
full = [
    "SciencePlots>=2.0",
    "tueplots>=0.2",
]
dev = [
    "pytest",
    "SciencePlots>=2.0",
    "tueplots>=0.2",
]

[project.urls]
Homepage = "https://github.com/taoge946/academic-figure-patterns"
Documentation = "https://github.com/taoge946/academic-figure-patterns#readme"
Repository = "https://github.com/taoge946/academic-figure-patterns"
Issues = "https://github.com/taoge946/academic-figure-patterns/issues"

[tool.setuptools.packages.find]
include = ["afp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
